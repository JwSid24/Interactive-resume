<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1944 1420" width="1944" height="1420"><rect width="1944" height="1420" fill="#F7F3EA"/><rect width="1944" height="96" fill="#241418"/><text x="36" y="62" font-family="Impact,'Arial Narrow',sans-serif" font-size="40" fill="#F7F3EA" letter-spacing="3">OPENING SCENE</text><text x="336" y="60" font-family="'Segoe UI',Arial,sans-serif" font-size="22" fill="#E9B83A" letter-spacing="4">KEY POSES · LAYOUT PASS · FOR REVIEW</text><rect x="33" y="127" width="606" height="344" fill="#241418"/><image href="png/01-establishing.png" x="36" y="130" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="36" y="502" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">1. Establishing shot</text><text x="36" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Wide lens, sun behind the far stand</text><rect x="669" y="127" width="606" height="344" fill="#241418"/><image href="png/02-ball-in-sky.png" x="672" y="130" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="672" y="502" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">2. Ball high in the sky</text><text x="672" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Camera tilts up, ball catches the sun</text><rect x="1305" y="127" width="606" height="344" fill="#241418"/><image href="png/03-ball-falling.png" x="1308" y="130" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="1308" y="502" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">3. Ball falling</text><text x="1308" y="530" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Motion trail, shadow forming on the pitch</text><rect x="33" y="557" width="606" height="344" fill="#241418"/><image href="png/04-jwandini-enters.png" x="36" y="560" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="36" y="932" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">4. Jwandini enters</text><text x="36" y="960" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Sprint in from the left, dust kick-up</text><rect x="669" y="557" width="606" height="344" fill="#241418"/><image href="png/05-run-to-ball.png" x="672" y="560" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="672" y="932" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">5. Run to the ball</text><text x="672" y="960" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Medium shot, eyes on the dropping ball</text><rect x="1305" y="557" width="606" height="344" fill="#241418"/><image href="png/06-first-touch.png" x="1308" y="560" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="1308" y="932" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">6. First touch</text><text x="1308" y="960" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Cushioned on the instep, arms for balance</text><rect x="33" y="987" width="606" height="344" fill="#241418"/><image href="png/07-control-closeup.png" x="36" y="990" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="36" y="1362" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">7. Control close-up</text><text x="36" y="1390" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Ball kills dead on the boot, focus lines</text><rect x="669" y="987" width="606" height="344" fill="#241418"/><image href="png/08-boot-on-ball.png" x="672" y="990" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="672" y="1362" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">8. Boot on the ball</text><text x="672" y="1390" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Low angle, socks + boots, grass streaks</text><rect x="1305" y="987" width="606" height="344" fill="#241418"/><image href="png/09-hero-reveal.png" x="1308" y="990" width="600" height="338" preserveAspectRatio="xMidYMid slice"/><text x="1308" y="1362" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="700" fill="#241418">9. Hero reveal</text><text x="1308" y="1390" font-family="'Segoe UI',Arial,sans-serif" font-size="18" fill="#7A6E5A">Low camera, sun behind, confident smile</text></svg>